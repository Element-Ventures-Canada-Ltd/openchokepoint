name: Contribution check

# Enforces the open-tier contribution terms for external contributors:
#   1. the CLA box in the PR description is checked, and
#   2. every commit carries a DCO "Signed-off-by:" line.
# Organization owners, members, collaborators, and the maintainers listed in
# MAINTAINER_LOGINS are exempt (their work is covered by employment or services
# agreements with EV). Logins are listed explicitly because private org
# membership is reported to workflows as CONTRIBUTOR.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  cla-and-dco:
    name: CLA and DCO
    if: >-
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.author_association != 'COLLABORATOR' &&
      !contains(fromJSON('["TLS-sys"]'), github.event.pull_request.user.login) &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check CLA acceptance
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$PR_BODY" | grep -qiE '^\s*-\s*\[x\]\s*I agree to the Contributor License Agreement'; then
            echo "CLA accepted."
          else
            echo "::error::Check the CLA box in the pull request description (see CLA.md / CCLA.md)."
            exit 1
          fi

      - name: Check DCO sign-off on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            if ! git show -s --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Commit $c is missing a DCO sign-off (use git commit -s)."
              missing=1
            fi
          done
          exit $missing
