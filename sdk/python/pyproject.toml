# Handling: Unclassified — public
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openchokepoint"
version = "0.1.0"
description = "Read-only Python client for OpenChokepoint supply-chain dependency registries"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[tool.setuptools]
packages = ["openchokepoint"]
