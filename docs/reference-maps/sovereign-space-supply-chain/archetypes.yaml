# Generic role archetypes for a country-agnostic space supply chain. No company, programme or country is named.
# Field notes are in README.md. Grades: C confirmed, R reported, I inferred, S speculative (mixed grades such as R/I
# keep both letters; `evidence_grade` in the example graph takes the weaker one).
#
# exposure and suppliers_worldwide_band are indicative bands, not measurements.
# export_regime names regime categories only (no technical data, no thresholds).
