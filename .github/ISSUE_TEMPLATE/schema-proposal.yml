name: Schema proposal
description: Propose a new type, property or validation rule
labels: [schema]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: "What can't be expressed today?" }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal, description: "Types, properties, values and a synthetic example." }
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
