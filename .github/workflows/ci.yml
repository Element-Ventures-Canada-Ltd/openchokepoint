name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  data-handling-guard:
    name: Data-handling guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Determine changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACM "origin/${{ github.base_ref }}"...HEAD > changed_files.txt
          else
            git diff --name-only --diff-filter=ACM HEAD~1 HEAD > changed_files.txt || touch changed_files.txt
          fi
      - run: python3 .github/scripts/data_handling_guard.py changed_files.txt

  validate:
    name: Schema validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: pip install pyyaml
      - name: Validate every example and data file
        run: python3 tools/validate.py $(find examples data -name '*.yaml' 2>/dev/null | sort)
      - name: Validator tests (standard library unittest)
        run: python3 -m unittest discover -s tests -v
      - name: PROV-O export parses (rdflib)
        run: |
          pip install rdflib
          python3 tools/export_prov.py --format ttl examples/synthetic-turbopump-thread.yaml > /tmp/prov.ttl
          python3 tools/export_prov.py --format json-ld examples/synthetic-turbopump-thread.yaml > /tmp/prov.jsonld
          python3 -c "from rdflib import Graph; [Graph().parse(p, format=f) for p, f in [('/tmp/prov.ttl','turtle'), ('/tmp/prov.jsonld','json-ld')]]; print('PROV-O output parses')"
