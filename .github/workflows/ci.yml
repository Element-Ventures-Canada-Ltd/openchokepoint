name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  data-handling-guard:
    name: Data-handling guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Determine changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACM "origin/${{ github.base_ref }}"...HEAD > changed_files.txt
          else
            git diff --name-only --diff-filter=ACM HEAD~1 HEAD > changed_files.txt || touch changed_files.txt
          fi
      - run: python3 .github/scripts/data_handling_guard.py changed_files.txt

  validate:
    name: Schema validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: pip install pyyaml
      - name: Validate every example and data file (synthetic only)
        run: python3 tools/validate.py $(find examples data -name '*.yaml' 2>/dev/null | sort)
