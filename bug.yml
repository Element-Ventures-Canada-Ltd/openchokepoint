name: Bug
description: The validator or a tool behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Include the command and a synthetic input that reproduces it." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
    validations: { required: true }
