# Updated to v0.3.0-draft
version: 0.3.0-draft

EvidenceRecord:
  type: object
  properties:
    id: { type: string }
    digest: { type: string, description: "Hex-encoded hash of the record" }
    hash_algorithm: { type: string, enum: ["sha256"] }
    issuer_id: { type: string }
    signature: { type: string, description: "Base64 encoded signature" }
  required: [id, digest, hash_algorithm, issuer_id, signature]
